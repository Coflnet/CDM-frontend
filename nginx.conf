server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip text assets
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long cache for hashed assets emitted by Vite.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Committed 3D models for the public AR demo. Not content-hashed – the app
    # appends ?v=N and bumps it when the meshes are regenerated. Explicit MIME
    # types: iOS Quick Look requires model/vnd.usdz+zip for the USDZ.
    location /models/ {
        access_log off;
        types {
            model/gltf-binary   glb;
            model/vnd.usdz+zip  usdz;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # SPA fallback – every unknown path serves index.html so vue-router can take over.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
